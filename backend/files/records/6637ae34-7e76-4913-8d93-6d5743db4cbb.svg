<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <title>LockRoute logo</title>
  <desc>LockRoute logo — waypoint padlock in brand blue with centered wordmark and tagline.</desc>

  <!-- Icon group (centered horizontally) -->
  <g transform="translate(145, 30)">
    <!-- Waypoint shackle dots -->
    <circle cx="20" cy="65" r="5" fill="#3B82F6"/>
    <circle cx="22" cy="45" r="5" fill="#3B82F6"/>
    <circle cx="35" cy="28" r="5" fill="#3B82F6"/>
    <circle cx="55" cy="22" r="5" fill="#3B82F6"/>
    <circle cx="75" cy="28" r="5" fill="#3B82F6"/>
    <circle cx="88" cy="45" r="5" fill="#3B82F6"/>
    <circle cx="90" cy="65" r="5" fill="#3B82F6"/>

    <!-- Lock body -->
    <rect x="6" y="65" width="98" height="74" rx="10" fill="#3B82F6"/>

    <!-- Destination pin -->
    <circle cx="55" cy="102" r="15" fill="#FFFFFF"/>
    <circle cx="55" cy="102" r="5" fill="#3B82F6"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="230" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#0A0A0A">Lock</tspan><tspan fill="#3B82F6">Route</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="260" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#6B7280">SECURE DISPATCH</text>
</svg>
